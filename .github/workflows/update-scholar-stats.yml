name: Update Scholar Stats

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch Google Scholar citations
        run: node scripts/update-scholar-stats.mjs
      - name: Commit updated stats
        run: |
          if git diff --quiet data/scholar-stats.json; then
            echo "No citation change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scholar-stats.json
            git commit -m "Update Google Scholar citation stats"
            git push
          fi
